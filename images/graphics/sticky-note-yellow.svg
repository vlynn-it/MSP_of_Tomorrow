<svg
    xmlns="http://www.w3.org/2000/svg"
    width="180"
    height="180"
    viewBox="0 0 180 180"
>

    <defs>

        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow
                dx="2"
                dy="4"
                stdDeviation="3"
                flood-color="#000000"
                flood-opacity="0.25"
            />
        </filter>

        <linearGradient
            id="noteGradient"
            x1="0%"
            y1="0%"
            x2="100%"
            y2="100%"
        >
            <stop offset="0%" stop-color="#F9D95B"/>
            <stop offset="100%" stop-color="#F3C93C"/>
        </linearGradient>

    </defs>

    <!-- Main Note -->

    <rect
        x="10"
        y="10"
        width="160"
        height="160"
        rx="8"
        fill="url(#noteGradient)"
        filter="url(#shadow)"
    />

    <!-- Folded Corner -->

    <polygon
        points="145,10 170,10 170,35"
        fill="#FFE88A"
    />

    <line
        x1="145"
        y1="10"
        x2="170"
        y2="35"
        stroke="#E0B92B"
        stroke-width="1"
    />

</svg>